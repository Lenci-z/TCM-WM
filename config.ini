[app]
# 数据库与种子数据路径（相对项目根目录）
db_path = data/rehab.db
seed_dir = data/seed
# PDF 处方单页眉信息
hospital_name = 江苏省中医院
department = 心血管康复门诊

[security]
# P3 起：AES 密钥不再存配置文件——优先环境变量 REHAB_ENCRYPT_KEY（base64 32字节），
# 否则首次运行自动生成 data/.secret_key（不入库）。
# 以下 XOR 密钥仅用于 scripts/migrate_encrypt.py 迁移存量数据（历史遗留，勿用于新数据）
xor_legacy_key = CR-Rehab-MVP-2026

[fonts]
# reportlab 中文字体（PDF 处方单）
pdf_font = C:/Windows/Fonts/msyh.ttc

[logging]
log_dir = data/logs
log_level = INFO
